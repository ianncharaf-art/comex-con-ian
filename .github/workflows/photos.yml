name: Bajar fotos

# Descarga las fotos de scripts/photos.txt desde Unsplash a img/ (en dos tamaños)
# y las sube al repo, así la web y la app las sirven desde su propio dominio.
on:
  push:
    paths: [scripts/photos.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p img
          grep -v '^#' scripts/photos.txt | while read -r name id _; do
            [ -z "$name" ] && continue
            curl -fsSL "https://images.unsplash.com/$id?w=2000&q=70&fm=jpg&fit=crop&auto=format" -o "img/$name.jpg"
            curl -fsSL "https://images.unsplash.com/$id?w=900&q=68&fm=jpg&fit=crop&auto=format" -o "img/$name-m.jpg"
          done
          ls -la img
      - name: Subir
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Fotos de Unsplash para la web" && git push
